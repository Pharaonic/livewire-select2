name: Build

on:
  push:
    branches:
      - develop
      - "[0-9]*.x"
  pull_request:
    branches:
      - develop
      - "[0-9]*.x"
  workflow_dispatch:

concurrency:
  group: "build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

# The 2.x line follows Livewire 2, which supports several Laravel majors. Each
# major is listed with the PHP minors it supports, instead of reading one
# ">=8.A <8.B" constraint.
jobs:
  php:
    name: PHP ${{ matrix.pair.php }} - Laravel ${{ matrix.pair.laravel }} - ${{ matrix.os }} - ${{ matrix.dependencies }}

    strategy:
      fail-fast: false
      matrix:
        pair:
          - { php: "8.0", laravel: "7", constraints: "--with laravel/framework:^7.30 --with orchestra/testbench:^5.20", browser: true }
          - { php: "8.0", laravel: "8", constraints: "--with laravel/framework:^8.75 --with orchestra/testbench:^6.25", browser: true }
          - { php: "8.1", laravel: "8", constraints: "--with laravel/framework:^8.75 --with orchestra/testbench:^6.25", browser: false }
          - { php: "8.0", laravel: "9", constraints: "--with laravel/framework:^9.0 --with orchestra/testbench:^7.0", browser: true }
          - { php: "8.1", laravel: "9", constraints: "--with laravel/framework:^9.0 --with orchestra/testbench:^7.0", browser: false }
          - { php: "8.2", laravel: "9", constraints: "--with laravel/framework:^9.0 --with orchestra/testbench:^7.0", browser: false }
          - { php: "8.1", laravel: "10", constraints: "--with laravel/framework:^10.0 --with orchestra/testbench:^8.0", browser: true }
          - { php: "8.2", laravel: "10", constraints: "--with laravel/framework:^10.0 --with orchestra/testbench:^8.0", browser: false }
          - { php: "8.3", laravel: "10", constraints: "--with laravel/framework:^10.0 --with orchestra/testbench:^8.0", browser: false }
        dependencies:
          - lowest
          - highest
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    # composer check runs once, on the lowest PHP with the highest dependencies:
    # a newer PHP installs a newer Pint with extra rules.
    env:
      CHECK: ${{ matrix.os == 'ubuntu-latest' && matrix.pair.php == '8.0' && matrix.pair.laravel == '9' && matrix.dependencies == 'highest' }}
      BROWSER: ${{ matrix.os == 'ubuntu-latest' && matrix.pair.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.pair.php }}
          extensions: fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ matrix.pair.constraints }}

      - name: Check
        if: env.CHECK == 'true'
        run: composer check

      - name: Analyse
        if: env.CHECK != 'true'
        run: composer analyse

      - name: Run tests
        if: env.CHECK != 'true'
        run: composer test

      # The JavaScript is the same on every PHP, so the browser suite runs on the lowest PHP of each Laravel major.
      - name: Setup Node
        if: env.BROWSER == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install browsers
        if: env.BROWSER == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      # Real Livewire 2 components, real browsers.
      - name: Run browser tests
        if: env.BROWSER == 'true'
        env:
          FIXTURE_PHP: php
          BROWSERS: chromium,firefox,webkit
        run: npm run test:browser

      - name: Upload browser traces
        if: failure() && env.BROWSER == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-php-${{ matrix.pair.php }}-laravel-${{ matrix.pair.laravel }}-${{ matrix.dependencies }}
          path: test-results/
          retention-days: 7

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # dist/ is committed so Composer users need no Node build; it must match the sources.
      - name: Verify the committed build
        run: npm run build:check
