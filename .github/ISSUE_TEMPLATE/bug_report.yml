name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: needs triage"
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the incorrect behavior clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code example or repository that reproduces the issue.
      render: blade
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "e.g. 8.1.34"
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "e.g. 8.83.29"
    validations:
      required: true

  - type: input
    id: livewire-version
    attributes:
      label: Livewire version
      placeholder: "e.g. 1.3.8"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add environment details or other information only if relevant.
