# Standard Pharaonic repository labels.
# Apply/update these through repository tooling only after explicit approval.
- name: "type: bug"
  description: "Something is not working as intended"
  color: "d73a4a"
- name: "type: feature"
  description: "New capability or enhancement"
  color: "a2eeef"
- name: "type: docs"
  description: "Documentation improvement"
  color: "0075ca"
- name: "type: maintenance"
  description: "Repository or maintenance work"
  color: "cfd3d7"
- name: "status: needs triage"
  description: "Needs maintainer review"
  color: "fbca04"
- name: "status: needs info"
  description: "More information is required"
  color: "d4c5f9"
- name: "status: blocked"
  description: "Cannot proceed yet"
  color: "b60205"
- name: "area: dependencies"
  description: "Dependency-related change"
  color: "0366d6"
- name: "area: compatibility"
  description: "Backward/runtime compatibility"
  color: "5319e7"
- name: "area: tests"
  description: "Test suite work"
  color: "0e8a16"
- name: "area: ci"
  description: "CI or automation"
  color: "1d76db"
- name: "breaking-change"
  description: "Potential or confirmed breaking change"
  color: "b60205"
- name: "good first issue"
  description: "Suitable for a first contribution"
  color: "7057ff"
- name: "help wanted"
  description: "Extra community help is welcome"
  color: "008672"
